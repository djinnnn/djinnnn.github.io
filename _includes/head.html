<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

{% include seo.html %}
{% include citation-meta.html %}

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">

{% assign asset_version = site.github.build_revision | default: site.time %}
<link rel="apple-touch-icon" href="{{ '/images/favicon-profile.png' | relative_url }}?v={{ asset_version | url_encode }}">
<link rel="icon" type="image/png" sizes="256x256" href="{{ '/images/favicon-profile.png' | relative_url }}?v={{ asset_version | url_encode }}">
<link rel="shortcut icon" type="image/png" href="{{ '/images/favicon-profile.png' | relative_url }}?v={{ asset_version | url_encode }}">
<link rel="manifest" href="{{ '/images/site.webmanifest' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/minimal-light.css' | relative_url }}?v={{ asset_version | url_encode }}">
